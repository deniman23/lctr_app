# Сборка release APK, manifest.json и выкладка на сервер.
#
# Secrets: ANDROID_KEYSTORE_*, DEPLOY_SSH_HOST, DEPLOY_SSH_USER, DEPLOY_SSH_KEY,
#          DEPLOY_REMOTE_DIR (каталог для nginx /static/releases)
# Variable: LOCATOR_PUBLIC_BASE_URL (default http://87.232.65.52:8080)
#
# manifest.json пишется в DEPLOY_REMOTE_DIR и в /root/locator_go/backend/static/releases

name: Android Release

on:
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - "gradle/**"
      - "scripts/ci/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Read version
        id: ver
        run: |
          chmod +x scripts/ci/extract-version.sh
          # shellcheck source=/dev/null
          source scripts/ci/extract-version.sh
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        run: |
          if [[ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]]; then
            echo "::error::Добавьте секрет ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Assemble release
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare release artifacts (APK + manifest.json)
        id: artifacts
        env:
          LOCATOR_PUBLIC_BASE_URL: ${{ vars.LOCATOR_PUBLIC_BASE_URL || 'http://87.232.65.52:8080' }}
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*-unsigned.apk" | head -1)
          if [[ -z "$APK" ]]; then
            APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          fi
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          NAME="locator-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}.apk"
          cp "$APK" "$NAME"

          chmod +x scripts/ci/write-manifest-json.sh
          scripts/ci/write-manifest-json.sh \
            "${{ steps.ver.outputs.name }}" \
            "${{ steps.ver.outputs.code }}" \
            "$NAME" \
            "$SHA" > manifest.json

          cp scripts/ci/deploy-release-on-server.sh deploy-release-on-server.sh
          chmod +x deploy-release-on-server.sh scripts/ci/deploy-to-server.sh

          echo "file=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          cat manifest.json

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}
          path: |
            ${{ steps.artifacts.outputs.file }}
            manifest.json

      - name: Deploy to server (SSH/SCP + locator_go manifest)
        timeout-minutes: 20
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_REMOTE_DIR: ${{ secrets.DEPLOY_REMOTE_DIR }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          APK_FILE: ${{ steps.artifacts.outputs.file }}
          MANIFEST_FILE: manifest.json
          LOCATOR_GO_RELEASES_DIR: ${{ vars.LOCATOR_GO_RELEASES_DIR || '/root/locator_go/backend/static/releases' }}
          SCP_TIMEOUT_SEC: "900"
        run: |
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > deploy_key.pem
          chmod 600 deploy_key.pem
          export DEPLOY_SSH_KEY_FILE="$RUNNER_TEMP/deploy_key.pem"
          mv deploy_key.pem "$DEPLOY_SSH_KEY_FILE"
          ./scripts/ci/deploy-to-server.sh

      - name: Verify manifest on public URL
        env:
          LOCATOR_PUBLIC_BASE_URL: ${{ vars.LOCATOR_PUBLIC_BASE_URL || 'http://87.232.65.52:8080' }}
        run: |
          URL="${LOCATOR_PUBLIC_BASE_URL%/}/static/releases/manifest.json"
          BODY=$(curl -fsS "$URL")
          echo "$BODY"
          echo "$BODY" | python3 -c "
          import json, sys
          m = json.load(sys.stdin)
          want_code = int('${{ steps.ver.outputs.code }}')
          want_name = '${{ steps.ver.outputs.name }}'
          if m.get('version_code') != want_code:
              raise SystemExit(f\"HTTP manifest version_code={m.get('version_code')} want {want_code}\")
          if m.get('version_name') != want_name:
              raise SystemExit(f\"HTTP manifest version_name={m.get('version_name')!r} want {want_name!r}\")
          print('Public manifest OK')
          "

      - name: Register release metadata on API
        env:
          LOCATOR_API_BASE: http://87.232.65.52:8080
          LOCATOR_ADMIN_API_KEY: ${{ secrets.LOCATOR_ADMIN_API_KEY }}
        run: |
          if [[ -z "${LOCATOR_ADMIN_API_KEY:-}" ]]; then
            echo "::notice::LOCATOR_ADMIN_API_KEY not set — skip"
            exit 0
          fi
          chmod +x scripts/ci/register-release-on-server.sh
          ./scripts/ci/register-release-on-server.sh \
            "${{ steps.ver.outputs.name }}" \
            "${{ steps.ver.outputs.code }}" \
            "/static/releases/${{ steps.artifacts.outputs.file }}" \
            "${{ steps.artifacts.outputs.sha256 }}" || echo "::warning::API register failed"

      - name: Summary
        run: |
          {
            echo "## Release ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }})"
            echo "- APK: \`${{ steps.artifacts.outputs.file }}\`"
            echo "- SHA256: \`${{ steps.artifacts.outputs.sha256 }}\`"
            echo "- Dirs: \`${{ secrets.DEPLOY_REMOTE_DIR }}\` + \`/root/locator_go/backend/static/releases\`"
            echo ""
            echo '### manifest.json'
            echo '```json'
            cat manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
