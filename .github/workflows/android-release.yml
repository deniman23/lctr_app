# Сборка release APK, manifest.json и выкладка на сервер одним workflow.
#
# Секреты (Settings → Secrets):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   DEPLOY_SSH_HOST, DEPLOY_SSH_USER, DEPLOY_SSH_KEY
#   DEPLOY_REMOTE_DIR  — каталог APK + manifest.json, например:
#                        /root/locator_go/backend/static/releases
#   LOCATOR_ADMIN_API_KEY — опционально
#
# Variables (опционально):
#   LOCATOR_PUBLIC_BASE_URL — http://178.172.235.51:8080
#
# Перед push: versionCode +1 в app/version.properties

name: Android Release

on:
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - "gradle/**"
      - "scripts/ci/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Read version
        id: ver
        run: |
          chmod +x scripts/ci/extract-version.sh
          # shellcheck source=/dev/null
          source scripts/ci/extract-version.sh
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        run: |
          if [[ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]]; then
            echo "::error::Добавьте секрет ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Assemble release
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare release artifacts (APK + manifest.json)
        id: artifacts
        env:
          LOCATOR_PUBLIC_BASE_URL: ${{ vars.LOCATOR_PUBLIC_BASE_URL || 'http://178.172.235.51:8080' }}
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*-unsigned.apk" | head -1)
          if [[ -z "$APK" ]]; then
            APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          fi
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          NAME="locator-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}.apk"
          cp "$APK" "$NAME"

          chmod +x scripts/ci/write-manifest-json.sh
          scripts/ci/write-manifest-json.sh \
            "${{ steps.ver.outputs.name }}" \
            "${{ steps.ver.outputs.code }}" \
            "$NAME" \
            "$SHA" > manifest.json

          echo "file=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "APK: $NAME"
          echo "SHA256: $SHA"
          echo "manifest.json:"
          cat manifest.json

          cp scripts/ci/deploy-release-on-server.sh deploy-release-on-server.sh
          chmod +x deploy-release-on-server.sh

      - name: Encode manifest.json (for SSH force-write)
        id: manifest_b64
        run: echo "value=$(base64 -w0 manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}
          path: |
            ${{ steps.artifacts.outputs.file }}
            manifest.json

      - name: Deploy to server (APK + manifest.json + deploy script)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "${{ steps.artifacts.outputs.file }},manifest.json,deploy-release-on-server.sh"
          target: ${{ secrets.DEPLOY_REMOTE_DIR }}/
          strip_components: 0
          overwrite: true

      - name: Force-update manifest.json on server (SSH)
        uses: appleboy/ssh-action@v1.0.3
        env:
          MANIFEST_B64: ${{ steps.manifest_b64.outputs.value }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: MANIFEST_B64
          script_stop: true
          script: |
            set -euo pipefail
            REMOTE_DIR="${{ secrets.DEPLOY_REMOTE_DIR }}"
            echo "$MANIFEST_B64" | base64 -d > "$REMOTE_DIR/manifest.json"
            chmod 644 "$REMOTE_DIR/manifest.json"
            echo "manifest.json written to $REMOTE_DIR ($(wc -c < "$REMOTE_DIR/manifest.json") bytes)"
            head -5 "$REMOTE_DIR/manifest.json"

      - name: Finalize on server (symlink + manifest check)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            REMOTE_DIR="${{ secrets.DEPLOY_REMOTE_DIR }}"
            APK="${{ steps.artifacts.outputs.file }}"
            bash "$REMOTE_DIR/deploy-release-on-server.sh" "$REMOTE_DIR" "$APK"
            if [[ -n "${{ vars.LOCATOR_RELEASES_MIRROR_DIR }}" ]]; then
              MIRROR="${{ vars.LOCATOR_RELEASES_MIRROR_DIR }}"
              mkdir -p "$MIRROR"
              cp -f "$REMOTE_DIR/manifest.json" "$MIRROR/manifest.json"
              cp -f "$REMOTE_DIR/$APK" "$MIRROR/$APK"
              ln -sf "$APK" "$MIRROR/locator-latest.apk"
              echo "mirrored to $MIRROR"
              ls -la "$MIRROR/manifest.json" "$MIRROR/$APK"
            fi

      - name: Verify manifest on public URL
        env:
          LOCATOR_PUBLIC_BASE_URL: ${{ vars.LOCATOR_PUBLIC_BASE_URL || 'http://178.172.235.51:8080' }}
        run: |
          URL="${LOCATOR_PUBLIC_BASE_URL%/}/static/releases/manifest.json"
          echo "GET $URL"
          BODY=$(curl -fsS "$URL")
          echo "$BODY"
          echo "$BODY" | python3 -c "
          import json, sys
          m = json.load(sys.stdin)
          expected_code = int('${{ steps.ver.outputs.code }}')
          expected_name = '${{ steps.ver.outputs.name }}'
          if m.get('version_code') != expected_code:
              raise SystemExit(f\"version_code: got {m.get('version_code')}, want {expected_code}\")
          if m.get('version_name') != expected_name:
              raise SystemExit(f\"version_name: got {m.get('version_name')!r}, want {expected_name!r}\")
          print('Public manifest OK')
          "

      - name: Register release metadata on API
        env:
          LOCATOR_API_BASE: http://178.172.235.51:8080
          LOCATOR_ADMIN_API_KEY: ${{ secrets.LOCATOR_ADMIN_API_KEY }}
        run: |
          if [[ -z "${LOCATOR_ADMIN_API_KEY:-}" ]]; then
            echo "::notice::LOCATOR_ADMIN_API_KEY not set — skip API register"
            exit 0
          fi
          chmod +x scripts/ci/register-release-on-server.sh
          ./scripts/ci/register-release-on-server.sh \
            "${{ steps.ver.outputs.name }}" \
            "${{ steps.ver.outputs.code }}" \
            "/static/releases/${{ steps.artifacts.outputs.file }}" \
            "${{ steps.artifacts.outputs.sha256 }}" || echo "::warning::API register skipped or failed"

      - name: Summary
        run: |
          {
            echo "## Release ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }})"
            echo "- APK: \`${{ steps.artifacts.outputs.file }}\`"
            echo "- SHA256: \`${{ steps.artifacts.outputs.sha256 }}\`"
            echo "- Deployed: APK + \`manifest.json\` → \`${{ secrets.DEPLOY_REMOTE_DIR }}\`"
            echo ""
            echo '### manifest.json (на сервере)'
            echo '```json'
            cat manifest.json
            echo '```'
            echo ""
            echo "### app_update payload"
            echo '```json'
            echo '{'
            echo '  "command": {'
            echo '    "type": "app_update",'
            echo '    "id": "release-'"${{ steps.ver.outputs.code }}"'",'
            echo '    "payload": {'
            echo '      "url": "/static/releases/${{ steps.artifacts.outputs.file }}",'
            echo '      "version": "${{ steps.ver.outputs.name }}",'
            echo '      "version_code": ${{ steps.ver.outputs.code }},'
            echo '      "sha256": "${{ steps.artifacts.outputs.sha256 }}"'
            echo '    }'
            echo '  }'
            echo '}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
